name: Tests E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build reproductible
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Même contenu → même version : sinon chaque déploiement viderait le cache hors ligne pour rien
      - name: Construire deux fois et comparer
        run: |
          node tools/build.mjs
          mv dist dist-1
          node tools/build.mjs
          diff -r dist-1 dist
      # Garde-fous Vercel : le domaine de production impose sa variante
      - name: Vérifier les garde-fous de domaine
        run: |
          SCORETRACK_VARIANT=pro VERCEL_PROJECT_PRODUCTION_URL=scoretrack.newgames.app node tools/build.mjs --vercel
          VERCEL_PROJECT_PRODUCTION_URL=scoretrack-light.newgames.app node tools/build.mjs --vercel
          SCORETRACK_VARIANT=test VERCEL_PROJECT_PRODUCTION_URL=scoretrack-test.newgames.app node tools/build.mjs --vercel
          if VERCEL_PROJECT_PRODUCTION_URL=scoretrack.newgames.app node tools/build.mjs --vercel; then echo "Le principal sans SCORETRACK_VARIANT=pro aurait dû échouer"; exit 1; fi
          if SCORETRACK_VARIANT=pro VERCEL_PROJECT_PRODUCTION_URL=scoretrack-light.newgames.app node tools/build.mjs --vercel; then echo "Light publié en pro aurait dû échouer"; exit 1; fi

  e2e:
    name: ${{ matrix.variant }} · ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [light, pro, test]
        project: [chromium, webkit, firefox]
    timeout-minutes: 15
    env:
      VARIANT: ${{ matrix.variant }}
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Installer le navigateur
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Lancer les tests E2E
        run: npx playwright test --project=${{ matrix.project }}
      - name: Publier le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.variant }}-${{ matrix.project }}
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7
