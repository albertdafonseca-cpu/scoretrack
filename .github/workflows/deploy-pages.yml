# Déploiement sur GitHub Pages depuis la branche par défaut (source Pages : « GitHub Actions »).
# Aucun secret n'est requis : l'authentification passe par le jeton OIDC (id-token) du dépôt.
# Le dépôt est servable tel quel (D2) : « deploy from branch » à la racine fonctionne aussi ; ce
# workflow ne fait que retirer les fichiers d'outillage de l'artefact publié (`npm run build:dist`,
# la même commande que la CI mesure avec Lighthouse).
name: Déploiement GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Permissions minimales : seul le job `deploy` reçoit les droits d'écriture sur Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Vérifications rapides et empaquetage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Garde-fous (lint, précache SW à jour, tests unitaires)
        run: npm run lint && npm run check:sw && npm run test:unit
      - name: 'Empaquetage dans dist/ (sans outillage : node_modules, tests, docs, scripts, configs)'
        run: |
          npm run build:dist
          echo "Contenu publié :" && find dist -type f | sort && du -sh dist
      - name: 'Contrôle : fichiers essentiels présents, outillage absent'
        run: |
          for f in index.html sw-st.js manifest-st.json .nojekyll \
                   js/main.js css/tokens.css icons/icon-192.png; do
            test -f "dist/$f" || { echo "Manque dist/$f"; exit 1; }
          done
          for f in package.json package-lock.json tests docs scripts node_modules .git; do
            test ! -e "dist/$f" || { echo "dist/$f ne doit pas être publié"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publication
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
