name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Un seul job séquentiel volontairement : le projet n'a pas de matrice de
# versions à couvrir (une seule cible : le build statique déployé par
# Vercel) ; enchaîner lint → typecheck → tests → build dans un seul job
# reproduit exactement `npm run ci` en local et donne un unique statut clair
# sur la PR. Le déploiement réel reste hors CI (Vercel s'en charge).
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
