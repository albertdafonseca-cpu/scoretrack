# Mises à jour automatiques des dépendances de développement et des actions GitHub.
# Il n'y a aucune dépendance à l'exécution : ces mises à jour n'affectent jamais l'application servie.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      outillage:
        patterns: ['*']
        # Playwright embarque Chromium : toute montée change la rastérisation et donc les captures
        # comparées à l'octet par le job `paquet`. Elle arrive en PR séparée, avec régénération
        # obligatoire des captures dans la même PR (ADR-19).
        exclude-patterns: ['@playwright/test']
        update-types: [minor, patch]
    commit-message:
      prefix: 'deps'
    labels: [dépendances]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Paris
    commit-message:
      prefix: 'ci'
    labels: [dépendances, ci]
