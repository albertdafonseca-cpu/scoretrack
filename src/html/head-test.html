<meta name="mobile-web-app-capable" content="yes">
<script>
  if(screen.orientation?.lock)screen.orientation.lock('portrait').catch(()=>{});
  document.addEventListener('contextmenu',e=>e.preventDefault());
  // Zoom pinch autorisé — pas de preventDefault sur multi-touch
  // Service Worker (fichier ./sw.js) — fonctionnement hors ligne + mise à jour automatique
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.warn('SW',e));
    // Reçoit la notification de mise à jour du SW
    navigator.serviceWorker.addEventListener('message', e => {
      if (e.data?.type === 'SW_UPDATED' && !document.getElementById('update-banner')) {
        // Bannière discrète en bas — tap pour recharger
        const b = document.createElement('button');
        b.id = 'update-banner'; b.type = 'button';
        b.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00ffe0;color:#020d12;font-family:Orbitron,monospace;font-size:11px;font-weight:700;letter-spacing:0.12em;padding:10px 20px;min-height:44px;border:none;border-radius:30px;z-index:9999;cursor:pointer;box-shadow:0 4px 20px rgba(0,255,224,0.4);white-space:nowrap;';
        b.textContent = (typeof t==='function') ? t('updateBanner') : 'Mise à jour disponible';
        b.onclick = () => location.reload();
        document.body.appendChild(b);
      }
    });
  }
</script>
