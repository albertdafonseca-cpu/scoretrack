<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">ScoreTrack</title>
  <desc id="d">Anneau segmenté en quatre sièges autour d'une table, avec des bâtons de comptage au centre.</desc>
  <!-- Fond : thème par défaut. rx est ajusté par scripts/build-icons.mjs selon la variante (arrondi ou plein). -->
  <rect id="bg" width="512" height="512" rx="112" fill="#020d12"/>
  <!-- Pictogramme : anneau (4 sièges) + bâtons de comptage. transform ajusté par build-icons.mjs pour la zone de sécurité maskable. -->
  <g id="mark" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anneau segmenté : 4 arcs de 60°, rayon 168, épaisseur 40 (accent #00ffe0) -->
    <g stroke="#00ffe0" stroke-width="40">
      <path d="M172 110.51A168 168 0 0 1 340 110.51"/>
      <path d="M401.49 172A168 168 0 0 1 401.49 340"/>
      <path d="M340 401.49A168 168 0 0 1 172 401.49"/>
      <path d="M110.51 340A168 168 0 0 1 110.51 172"/>
    </g>
    <!-- Bâtons de comptage : 3 barres + 1 barre oblique (blanc cassé #e8fffb) -->
    <g stroke="#e8fffb" stroke-width="30">
      <path d="M200 192v128"/>
      <path d="M256 192v128"/>
      <path d="M312 192v128"/>
      <path d="M166 322 346 190"/>
    </g>
  </g>
</svg>
